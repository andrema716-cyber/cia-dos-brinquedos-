<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Drift via Web Bluetooth</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    button { width: 100%; max-width: 300px; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    .btn-conn { background: #2196F3; color: white; }
    .btn-start { background: #4CAF50; color: white; }
    .btn-stop { background: #F44336; color: white; }
    #status { margin: 15px 0; font-size: 20px; color: #FFC107; }
  </style>
</head>
<body>

  <h1>Controle Drift (Bluetooth)</h1>
  <div id="status">Desconectado</div>

  <button class="btn-conn" onclick="conectarBluetooth()">1. Conectar Bluetooth</button>
  <button class="btn-start" onclick="enviarComando('INICIAR')">Iniciar 5 Min (R$ 5)</button>
  <button class="btn-start" onclick="enviarComando('ADICIONAR')">+5 Minutos</button>
  <button class="btn-stop" onclick="enviarComando('PARAR')">Desligar Agora</button>

  <script>
    const SERVICE_UUID = "4fa1c201-222d-4b93-9fb6-52c1e7f32d88";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    
    let bluetoothDevice;
    let caracteristicaBLE;

    async function conectarBluetooth() {
      try {
        document.getElementById('status').innerText = "Procurando carrinho...";
        
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'Drift' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        caracteristicaBLE = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById('status').innerText = "CONECTADO: " + bluetoothDevice.name;
        document.getElementById('status').style.color = "#4CAF50";
      } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = "Erro ao conectar.";
        document.getElementById('status').style.color = "#F44336";
      }
    }

    async function enviarComando(comando) {
      if (!caracteristicaBLE) {
        alert("Conecte ao Bluetooth primeiro!");
        return;
      }
      try {
        const encoder = new TextEncoder();
        await caracteristicaBLE.writeValue(encoder.encode(comando));
      } catch (error) {
        console.error("Erro ao enviar comando:", error);
      }
    }
  </script>
</body>
</html>
