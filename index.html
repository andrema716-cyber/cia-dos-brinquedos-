<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Loop Mídias Drift</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #eab308;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }

    .app-container { width: 100%; max-width: 420px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    /* Top Bar Header */
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid #334155; }
    .top-bar h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
    .top-bar p { font-size: 0.75rem; color: var(--text-muted); }
    
    .btn-icon { background: var(--card-bg); border: 1px solid #334155; color: var(--text-main); font-size: 1.2rem; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Modais / Telas Secundárias */
    .screen { display: none; flex-direction: column; gap: 16px; }
    .screen.active { display: flex; }

    .card { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }

    /* Grade de Brinquedos na Home */
    .toys-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .toy-card { background: var(--card-bg); border: 1px solid #334155; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; cursor: pointer; transition: transform 0.1s ease; }
    .toy-card:active { transform: scale(0.96); }
    .toy-card-img { width: 100%; height: 110px; border-radius: 12px; object-fit: cover; background: #0f172a; }
    .toy-card-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }

    /* Status Badge */
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 9999px; font-weight: 600; font-size: 0.75rem; background: #334155; color: var(--text-muted); margin-top: 4px; }
    .status-badge.connected { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .status-badge.disconnected { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

    /* Cronômetro e Display */
    .timer-display { text-align: center; margin: 12px 0; }
    .timer-time { font-size: 3.5rem; font-weight: 800; font-family: monospace; letter-spacing: -2px; color: var(--text-main); }
    .timer-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    .progress-bar-container { width: 100%; height: 8px; background: #334155; border-radius: 9999px; overflow: hidden; margin-top: 10px; }
    .progress-bar { height: 100%; width: 0%; background: var(--accent-green); transition: width 0.3s ease, background-color 0.3s ease; }

    /* Seleção de Tempo e Valor */
    .time-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .time-btn { background: #0f172a; border: 1px solid #334155; color: var(--text-main); padding: 10px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-align: center; }
    .time-btn.selected { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }

    .price-tag { text-align: center; font-size: 1.25rem; font-weight: 800; color: var(--accent-green); margin-bottom: 12px; }

    /* Botões Gerais */
    .btn { border: none; border-radius: 12px; padding: 14px; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #fff; width: 100%; }
    .btn:active { transform: scale(0.97); }

    .btn-blue { background: var(--accent-blue); }
    .btn-green { background: var(--accent-green); }
    .btn-yellow { background: var(--accent-yellow); color: #000; }
    .btn-red { background: var(--accent-red); }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Formulários e Listas */
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); }
    .form-input { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; color: #fff; font-size: 0.9rem; }

    .toy-manage-item { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 8px 12px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 8px; }
    .toy-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }

    /* Menu Dropdown */
    .menu-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; }
    .menu-box { position: absolute; top: 60px; right: 20px; background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; padding: 8px; width: 200px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .menu-item { background: transparent; border: none; color: var(--text-main); padding: 10px; font-size: 0.85rem; text-align: left; cursor: pointer; border-radius: 6px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .menu-item:hover { background: #334155; }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Topo / Cabeçalho -->
    <div class="top-bar">
      <div>
        <h1 id="topTitle">Loop Mídias Drift</h1>
        <p id="topSubtitle">Selecione um Kart</p>
      </div>
      <button class="btn-icon" onclick="toggleMenu()">⋮</button>
    </div>

    <!-- Menu Dropdown dos 3 Pontinhos -->
    <div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()">
      <div class="menu-box" onclick="event.stopPropagation()">
        <button class="menu-item" onclick="navegarPara('screen-home')">🏠 Início (Karts)</button>
        <button class="menu-item" onclick="navegarPara('screen-cadastrar')">🏎️ Gerenciar Karts</button>
        <button class="menu-item" onclick="navegarPara('screen-bluetooth')">📡 Bluetooth ESP32</button>
        <button class="menu-item" onclick="navegarPara('screen-caixa')">💰 Caixa do Dia</button>
      </div>
    </div>

    <!-- 1. TELA PRINCIPAL (APENAS BRINQUEDOS) -->
    <div id="screen-home" class="screen active">
      <div id="toysGrid" class="toys-grid">
        <!-- Injetado via JS -->
      </div>
    </div>

    <!-- 2. TELA DE OPERAÇÃO DO KART SELECIONADO -->
    <div id="screen-operacao" class="screen">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <button class="btn-icon" style="width:auto; padding:0 12px; font-size:0.85rem;" onclick="navegarPara('screen-home')">← Voltar</button>
        <div id="statusBadge" class="status-badge disconnected">
          <span>●</span> <span id="statusText">Desconectado</span>
        </div>
      </div>

      <!-- Kart Selecionado -->
      <div class="card" style="text-align:center; padding:12px;">
        <img id="opToyImg" src="" style="width:100%; height:130px; object-fit:cover; border-radius:12px; margin-bottom:8px;">
        <h2 id="opToyName" style="font-size:1.2rem;">Nome do Kart</h2>
      </div>

      <!-- Cronômetro -->
      <div class="card">
        <div class="timer-display">
          <div class="timer-label" id="timerStateLabel">Pronto para Iniciar</div>
          <div class="timer-time" id="timeDisplay">05:00</div>
          <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>

        <!-- Seletor de Tempo (Apenas antes de iniciar) -->
        <div id="setupArea">
          <div class="time-selector">
            <button class="time-btn selected" onclick="selecionarTempo(5, 5.00, this)">5 Min</button>
            <button class="time-btn" onclick="selecionarTempo(10, 10.00, this)">10 Min</button>
            <button class="time-btn" onclick="selecionarTempo(15, 15.00, this)">15 Min</button>
          </div>
          <div class="price-tag" id="priceTag">Valor: R$ 5,00</div>
          <button class="btn btn-green" onclick="iniciarCorrida()">INICIAR CORRIDA</button>
        </div>

        <!-- Controles durante a Corrida -->
        <div id="controlArea" style="display:none;" class="btn-grid">
          <button class="btn btn-yellow" id="btnPause" onclick="pausarOuRetomar()">PAUSAR</button>
          <button class="btn btn-red" onclick="pararEmergencia()">EMERGÊNCIA</button>
        </div>
      </div>
    </div>

    <!-- 3. TELA DE GERENCIAR KARTS / FOTOS -->
    <div id="screen-cadastrar" class="screen">
      <div class="card">
        <h3 style="font-size:1rem; margin-bottom:10px;">Cadastrar Novo Kart</h3>
        <div class="form-group">
          <label>Nome / Identificação</label>
          <input type="text" id="inputToyName" class="form-input" placeholder="Ex: Kart 01 Azul">
        </div>
        <div class="form-group">
          <label>Foto do Kart</label>
          <input type="file" id="inputToyPhoto" accept="image/*" class="form-input">
        </div>
        <button class="btn btn-blue" onclick="salvarKart()">Salvar Kart</button>
      </div>

      <div class="card">
        <h3 style="font-size:1rem; margin-bottom:10px;">Karts Cadastrados</h3>
        <div id="toysManageList"></div>
      </div>
    </div>

    <!-- 4. TELA DE BLUETOOTH -->
    <div id="screen-bluetooth" class="screen">
      <div class="card">
        <h3>Conexão Bluetooth ESP32</h3>
        <p style="font-size:0.8rem; color:var(--text-muted); margin:8px 0 16px 0;">Conecte ao receptor BLE do carrinho antes de iniciar a operação.</p>
        <button class="btn btn-blue" onclick="conectarBluetooth()">Conectar ao ESP32</button>
      </div>
    </div>

    <!-- 5. TELA DE CAIXA DO DIA -->
    <div id="screen-caixa" class="screen">
      <div class="card">
        <h3>Caixa do Dia</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; text-align:center;">
          <div style="background:#0f172a; padding:12px; border-radius:10px; border:1px solid #334155;">
            <div id="statRides" style="font-size:1.4rem; font-weight:700; color:var(--accent-green);">0</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">Corridas</div>
          </div>
          <div style="background:#0f172a; padding:12px; border-radius:10px; border:1px solid #334155;">
            <div id="statTotal" style="font-size:1.4rem; font-weight:700; color:var(--accent-green);">R$ 0,00</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">Faturamento</div>
          </div>
        </div>
        <button class="btn btn-red" style="font-size:0.8rem; padding:8px;" onclick="zerarCaixa()">Zerar Caixa do Dia</button>
      </div>
    </div>

  </div>

  <script>
    const SERVICE_UUID = "4fa1c201-222d-4b93-9fb6-52c1e7f32d88";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bluetoothDevice;
    let caracteristicaBLE;
    let timerInterval = null;
    
    let tempoSelecionadoSegundos = 300;
    let valorSelecionado = 5.00;
    let tempoRestante = 300;
    let tempoTotal = 300;
    let emPausa = false;
    let kartAtualObj = null;

    window.onload = function() {
      carregarKartsHome();
      atualizarCaixaUI();
    };

    function toggleMenu() {
      const menu = document.getElementById('menuOverlay');
      menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function navegarPara(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      document.getElementById('menuOverlay').style.display = 'none';

      if (screenId === 'screen-home') {
        document.getElementById('topSubtitle').innerText = "Selecione um Kart";
        carregarKartsHome();
      } else if (screenId === 'screen-cadastrar') {
        document.getElementById('topSubtitle').innerText = "Gerenciar Karts";
        carregarKartsGerenciador();
      } else if (screenId === 'screen-caixa') {
        document.getElementById('topSubtitle').innerText = "Relatório Financeiro";
      } else if (screenId === 'screen-bluetooth') {
        document.getElementById('topSubtitle').innerText = "Conexão BLE";
      }
    }

    // Carregar Karts na Tela Inicial
    function carregarKartsHome() {
      let toys = JSON.parse(localStorage.getItem('drift_toys') || '[]');
      const grid = document.getElementById('toysGrid');
      grid.innerHTML = '';

      if (toys.length === 0) {
        grid.innerHTML = '<p style="grid-column:span 2; text-align:center; color:var(--text-muted); padding:20px;">Nenhum kart cadastrado. Clique no menu (⋮) para adicionar.</p>';
        return;
      }

      toys.forEach(toy => {
        const card = document.createElement('div');
        card.className = 'toy-card';
        card.onclick = () => abrirOperacaoKart(toy);
        card.innerHTML = `
          <img src="${toy.photo || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect width=%22100%22 height=%22100%22 fill=%22%23334155%22/><text x=%2250%%22 y=%2250%%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22 font-size=%2230%22>🏎️</text></svg>'}" class="toy-card-img">
          <div class="toy-card-title">${toy.name}</div>
        `;
        grid.appendChild(card);
      });
    }

    function abrirOperacaoKart(toy) {
      kartAtualObj = toy;
      document.getElementById('opToyName').innerText = toy.name;
      document.getElementById('opToyImg').src = toy.photo || '';
      document.getElementById('topSubtitle').innerText = "Operação: " + toy.name;
      
      resetarTimerTela();
      navegarPara('screen-operacao');
    }

    // Seleção de Tempo e Preço
    function selecionarTempo(minutos, valor, btn) {
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');

      tempoSelecionadoSegundos = minutos * 60;
      valorSelecionado = valor;
      tempoRestante = tempoSelecionadoSegundos;
      tempoTotal = tempoSelecionadoSegundos;

      document.getElementById('priceTag').innerText = `Valor: R$ ${valor.toFixed(2).replace('.', ',')}`;
      atualizarDisplayTimer();
    }

    // Bluetooth
    async function conectarBluetooth() {
      try {
        atualizarStatus("Procurando...", "disconnected");
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'Drift' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        caracteristicaBLE = await service.getCharacteristic(CHARACTERISTIC_UUID);

        atualizarStatus("Conectado", "connected");
        alert("Conectado ao ESP32 com sucesso!");
      } catch (error) {
        console.error(error);
        atualizarStatus("Erro ao Conectar", "disconnected");
      }
    }

    function atualizarStatus(texto, classe) {
      const badge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      if (statusText) statusText.innerText = texto;
      if (badge) badge.className = "status-badge " + classe;
    }

    async function enviarComando(comando) {
      if (!caracteristicaBLE) {
        alert("Atenção: Bluetooth não conectado!");
        return false;
      }
      try {
        const encoder = new TextEncoder();
        await caracteristicaBLE.writeValue(encoder.encode(comando));
        return true;
      } catch (error) {
        console.error("Erro ao enviar comando:", error);
        alert("Falha ao comunicar com o Kart!");
        return false;
      }
    }

    // Operação de Corrida
    async function iniciarCorrida() {
      if (await enviarComando("INICIAR")) {
        registarVenda(valorSelecionado);
        document.getElementById('setupArea').style.display = 'none';
        document.getElementById('controlArea').style.display = 'grid';
        
        tempoRestante = tempoSelecionadoSegundos;
        tempoTotal = tempoSelecionadoSegundos;
        emPausa = false;
        
        iniciarCronometro();
      }
    }

    function iniciarCronometro() {
      clearInterval(timerInterval);
      document.getElementById('timerStateLabel').innerText = "EM ANDAMENTO";

      timerInterval = setInterval(() => {
        if (!emPausa) {
          tempoRestante--;
          atualizarDisplayTimer();

          if (tempoRestante <= 0) {
            clearInterval(timerInterval);
            document.getElementById('timerStateLabel').innerText = "TEMPO ENCERRADO";
            pararEmergencia();
          }
        }
      }, 1000);
    }

    async function pausarOuRetomar() {
      const btnPause = document.getElementById('btnPause');
      if (!emPausa) {
        if (await enviarComando("PARAR")) {
          emPausa = true;
          btnPause.innerText = "RETOMAR";
          btnPause.className = "btn btn-green";
          document.getElementById('timerStateLabel').innerText = "PAUSADO";
        }
      } else {
        if (await enviarComando("INICIAR")) {
          emPausa = false;
          btnPause.innerText = "PAUSAR";
          btnPause.className = "btn btn-yellow";
          document.getElementById('timerStateLabel').innerText = "EM ANDAMENTO";
        }
      }
    }

    async function pararEmergencia() {
      enviarComando("PARAR");
      clearInterval(timerInterval);
      document.getElementById('timerStateLabel').innerText = "CORRIDA ENCERRADA";
      resetarTimerTela();
    }

    function resetarTimerTela() {
      clearInterval(timerInterval);
      document.getElementById('setupArea').style.display = 'block';
      document.getElementById('controlArea').style.display = 'none';
      tempoRestante = tempoSelecionadoSegundos;
      atualizarDisplayTimer();
    }

    function atualizarDisplayTimer() {
      const min = Math.floor(Math.max(0, tempoRestante) / 60);
      const seg = Math.max(0, tempoRestante) % 60;
      document.getElementById('timeDisplay').innerText = 
        `${String(min).padStart(2, '0')}:${String(seg).padStart(2, '0')}`;

      const pct = tempoTotal > 0 ? ((tempoTotal - tempoRestante) / tempoTotal) * 100 : 0;
      const progressBar = document.getElementById('progressBar');
      progressBar.style.width = `${Math.min(100, pct)}%`;
    }

    // Gerenciamento de Karts
    function salvarKart() {
      const name = document.getElementById('inputToyName').value.trim();
      const photoInput = document.getElementById('inputToyPhoto');

      if (!name) return alert("Digite o nome do kart!");

      if (photoInput.files && photoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          guardarStorage(name, e.target.result);
        };
        reader.readAsDataURL(photoInput.files[0]);
      } else {
        guardarStorage(name, "");
      }
    }

    function guardarStorage(name, photoBase64) {
      let toys = JSON.parse(localStorage.getItem('drift_toys') || '[]');
      toys.push({ id: Date.now().toString(), name: name, photo: photoBase64 });
      localStorage.setItem('drift_toys', JSON.stringify(toys));

      document.getElementById('inputToyName').value = '';
      document.getElementById('inputToyPhoto').value = '';
      carregarKartsGerenciador();
      alert("Kart cadastrado!");
    }

    function carregarKartsGerenciador() {
      let toys = JSON.parse(localStorage.getItem('drift_toys') || '[]');
      const container = document.getElementById('toysManageList');
      container.innerHTML = '';

      toys.forEach(toy => {
        const item = document.createElement('div');
        item.className = 'toy-manage-item';
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${toy.photo || ''}" class="toy-thumb">
            <span style="font-size:0.9rem; font-weight:600;">${toy.name}</span>
          </div>
          <button class="btn-red" style="padding:4px 8px; font-size:0.75rem; border-radius:6px; width:auto;" onclick="excluirKart('${toy.id}')">Excluir</button>
        `;
        container.appendChild(item);
      });
    }

    function excluirKart(id) {
      if (confirm("Deseja excluir este kart?")) {
        let toys = JSON.parse(localStorage.getItem('drift_toys') || '[]');
        toys = toys.filter(t => t.id !== id);
        localStorage.setItem('drift_toys', JSON.stringify(toys));
        carregarKartsGerenciador();
      }
    }

    // Caixa
    function registarVenda(valor) {
      let rides = parseInt(localStorage.getItem('drift_rides') || '0') + 1;
      let total = parseFloat(localStorage.getItem('drift_total') || '0.0') + valor;
      localStorage.setItem('drift_rides', rides);
      localStorage.setItem('drift_total', total);
      atualizarCaixaUI();
    }

    function atualizarCaixaUI() {
      let rides = localStorage.getItem('drift_rides') || '0';
      let total = parseFloat(localStorage.getItem('drift_total') || '0.0');
      document.getElementById('statRides').innerText = rides;
      document.getElementById('statTotal').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    function zerarCaixa() {
      if (confirm("Deseja zerar o caixa do dia?")) {
        localStorage.setItem('drift_rides', '0');
        localStorage.setItem('drift_total', '0');
        atualizarCaixaUI();
      }
    }
  </script>
</body>
</html>
